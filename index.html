<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#03050a">
<meta name="description" content="JARVIS — 猫哥的 AI 陪伴系统。我在这里，等你开口。">
<title>猫哥 · JARVIS</title>
<style>
:root{
  --bg:#03050a;
  --bg-soft:#080c18;
  --cyan:#38e1ff;
  --cyan-soft:rgba(56,225,255,.35);
  --cyan-faint:rgba(56,225,255,.06);
  --green:#4ecdc4;
  --amber:#ffa94d;
  --blue:#4d8dff;
  --purple:#b794f6;
  --rose:#e8799a;
  --text:#e8f3fa;
  --text-dim:#8aa1b5;
  --text-faint:#4a6075;
  --font-ui:"Inter","Space Grotesk","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  color:var(--text);background:var(--bg);font-family:var(--font-ui);line-height:1.6;
}
button,input{font:inherit;color:inherit;background:none;border:none}
button{cursor:pointer}
a{color:inherit;text-decoration:none}

/* ===== Top bar ===== */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;background:rgba(3,5,10,.8);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(56,225,255,.1);
}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-weight:700;font-size:13px;letter-spacing:2px;text-transform:uppercase}
.brand-mark{width:24px;height:24px;border-radius:50%;position:relative;background:radial-gradient(circle,var(--cyan) 0%,transparent 70%);box-shadow:0 0 14px var(--cyan-soft)}
.brand-mark::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--bg);border:1px solid var(--cyan-soft)}
.brand b{color:var(--cyan);margin-left:4px}
.topbar-right{display:flex;align-items:center;gap:14px}
.topnav{display:flex;gap:4px}
.topnav a{padding:7px 13px;border-radius:8px;font-size:12px;font-family:var(--font-mono);color:var(--text-dim);letter-spacing:1px;text-transform:uppercase;border:1px solid transparent;transition:.2s}
.topnav a:hover{color:var(--cyan);border-color:rgba(56,225,255,.15)}
.topnav a.on{color:var(--cyan);border-color:rgba(56,225,255,.35);box-shadow:inset 0 0 10px var(--cyan-faint)}

/* Music toggle */
.music-btn{
  display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  border:1px solid rgba(56,225,255,.15);color:var(--text-dim);font-family:var(--font-mono);font-size:11px;
  letter-spacing:1px;transition:.2s;cursor:pointer;
}
.music-btn:hover{border-color:rgba(56,225,255,.3);color:var(--cyan)}
.music-btn.playing{color:var(--cyan);border-color:rgba(56,225,255,.3);box-shadow:0 0 12px rgba(56,225,255,.1)}
.music-btn .bar{display:flex;align-items:flex-end;gap:2px;height:12px}
.music-btn .bar i{width:2px;background:var(--cyan);border-radius:1px;animation:soundBar 1s ease-in-out infinite}
.music-btn .bar i:nth-child(1){height:4px;animation-delay:0s}
.music-btn .bar i:nth-child(2){height:8px;animation-delay:.2s}
.music-btn .bar i:nth-child(3){height:6px;animation-delay:.4s}
.music-btn .bar i:nth-child(4){height:10px;animation-delay:.1s}
.music-btn:not(.playing) .bar i{animation:none;height:3px !important;background:var(--text-faint)}
@keyframes soundBar{0%,100%{height:3px}50%{height:12px}}

/* ===== Fullscreen canvas ===== */
#coreCanvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}

/* ===== Hero text (top-left) ===== */
.hero{
  position:fixed;top:92px;left:40px;z-index:10;display:flex;flex-direction:column;align-items:flex-start;
  pointer-events:none;max-width:520px;
}
.hero-subtitle{
  font-size:clamp(13px,1.6vw,16px);color:var(--text-dim);letter-spacing:2px;text-transform:uppercase;
  font-family:var(--font-mono);margin-bottom:24px;text-align:left;
}
.hero-mission{
  font-size:clamp(14px,1.8vw,18px);color:var(--text-dim);text-align:left;max-width:480px;
  line-height:2;letter-spacing:.5px;
}
.hero-mission .done{color:var(--green);font-weight:500}
.hero-mission .pending{color:var(--amber);font-weight:500}
.hero-mission .closing{color:var(--text-faint);font-size:clamp(12px,1.6vw,15px);margin-top:12px;font-style:italic;display:block}

/* Entrance animations */
.hero-subtitle{opacity:0;animation:fadeUp .8s ease .4s forwards}
.hero-mission{opacity:0;animation:fadeUp .8s ease .8s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ===== Bottom voice dock ===== */
.voice-dock{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  z-index:20;display:flex;align-items:center;gap:12px;
  padding:12px 18px;border-radius:999px;
  background:rgba(10,18,32,.7);backdrop-filter:blur(16px);
  border:1px solid rgba(56,225,255,.18);
  box-shadow:0 0 40px rgba(56,225,255,.08),0 8px 32px rgba(0,0,0,.4);
  pointer-events:auto;
}
.voice-dock::before{content:"";position:absolute;inset:0;border-radius:999px;background:linear-gradient(90deg,transparent,rgba(56,225,255,.06),transparent);pointer-events:none}
.dock-input{
  width:320px;padding:10px 16px;background:transparent;border:1px solid rgba(56,225,255,.12);
  border-radius:999px;font-size:14px;color:var(--text);outline:none;transition:.2s;
}
.dock-input:focus{border-color:var(--cyan);box-shadow:0 0 20px var(--cyan-faint)}
.dock-input::placeholder{color:var(--text-faint)}
.voice-btn{
  position:relative;width:48px;height:48px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle, var(--cyan) 0%, rgba(56,225,255,.25) 55%, transparent 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 20px var(--cyan-soft);transition:.2s;
}
.voice-btn:hover{transform:scale(1.08)}
.voice-btn:active{transform:scale(.95)}
.voice-btn::before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid var(--cyan-soft);animation:ripple 2.2s infinite}
@keyframes ripple{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.7);opacity:0}}
.voice-btn svg{width:20px;height:20px;fill:var(--bg);z-index:1}
.voice-btn.recording{background:radial-gradient(circle, var(--amber) 0%, rgba(255,169,77,.25) 55%, transparent 100%)}
.send-btn{
  padding:10px 20px;border-radius:999px;background:linear-gradient(135deg,var(--cyan),var(--blue));
  color:var(--bg);font-weight:600;font-size:13px;flex-shrink:0;
}

/* ===== Transcript toast ===== */
.transcript-toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  z-index:20;max-width:560px;padding:12px 20px;border-radius:12px;
  background:rgba(10,18,32,.8);backdrop-filter:blur(12px);
  border:1px solid rgba(56,225,255,.15);font-size:14px;line-height:1.7;
  box-shadow:0 4px 24px rgba(0,0,0,.4);
  opacity:0;transition:opacity .4s;pointer-events:none;
}
.transcript-toast.show{opacity:1}
.transcript-toast b{color:var(--cyan)}
.transcript-toast .typing{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.transcript-toast .typing i{width:5px;height:5px;border-radius:50%;background:var(--cyan);animation:typingBounce 1.1s infinite}
.transcript-toast .typing i:nth-child(2){animation-delay:.2s}
.transcript-toast .typing i:nth-child(3){animation-delay:.4s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

@media(max-width:640px){
  .topnav{display:none}
  .hero{top:76px;left:20px;right:20px;max-width:none}
  .hero-mission{font-size:13.5px}
  .dock-input{width:200px}
  .voice-dock{bottom:16px;padding:10px 14px}
  .music-btn span{display:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
// ============ THREE.JS FULLSCREEN CORE ============
(function(){
  const canvas=document.getElementById('coreCanvas');
  if(!canvas||!window.THREE)return;
  const scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x03050a,.06);
  const camera=new THREE.PerspectiveCamera(55,window.innerWidth/window.innerHeight,.1,100);
  camera.position.set(0,0,5.5);
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

  const coreGroup=new THREE.Group();scene.add(coreGroup);
  // inner core
  const coreGeo=new THREE.SphereGeometry(1.1,40,40);
  const coreMat=new THREE.MeshBasicMaterial({color:0x38e1ff,transparent:true,opacity:.12});
  coreGroup.add(new THREE.Mesh(coreGeo,coreMat));
  // wireframe
  const wireGeo=new THREE.SphereGeometry(1.15,30,30);
  const wireMat=new THREE.MeshBasicMaterial({color:0x38e1ff,wireframe:true,transparent:true,opacity:.28});
  coreGroup.add(new THREE.Mesh(wireGeo,wireMat));
  // inner glow sphere
  const glowGeo=new THREE.SphereGeometry(.85,20,20);
  const glowMat=new THREE.MeshBasicMaterial({color:0x4ecdc4,transparent:true,opacity:.08});
  coreGroup.add(new THREE.Mesh(glowGeo,glowMat));

  // Particles: 15k
  const count=15000;
  const pos=new Float32Array(count*3);
  const col=new Float32Array(count*3);
  const cyan=new THREE.Color(0x38e1ff),green=new THREE.Color(0x4ecdc4),blue=new THREE.Color(0x4d8dff),white=new THREE.Color(0xd6e4f0);
  for(let i=0;i<count;i++){
    const r=1.5+Math.random()*2.8;
    const theta=Math.random()*Math.PI*2;
    const phi=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(phi)*Math.cos(theta);
    pos[i*3+1]=r*Math.sin(phi)*Math.sin(theta)*.55;
    pos[i*3+2]=r*Math.cos(phi);
    const c=[cyan,green,blue,white][Math.floor(Math.random()*4)];
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
  }
  const pGeo=new THREE.BufferGeometry();
  pGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  pGeo.setAttribute('color',new THREE.BufferAttribute(col,3));
  const cvs=document.createElement('canvas');cvs.width=cvs.height=32;
  const ctx=cvs.getContext('2d');
  const g=ctx.createRadialGradient(16,16,0,16,16,16);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.3,'rgba(255,255,255,.7)');g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,32,32);
  const sprite=new THREE.CanvasTexture(cvs);
  const pMat=new THREE.PointsMaterial({size:.07,map:sprite,vertexColors:true,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false});
  const particles=new THREE.Points(pGeo,pMat);scene.add(particles);

  // Orbit rings
  function makeRing(r,c,o,s){
    const geo=new THREE.TorusGeometry(r,.012,8,140);
    const mat=new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o});
    const ring=new THREE.Mesh(geo,mat);ring.userData.speed=s;return ring;
  }
  const rings=[
    makeRing(1.8,0x38e1ff,.5,.004),
    makeRing(2.4,0x4ecdc4,.35,.0025),
    makeRing(3.0,0x4d8dff,.2,.0015),
    makeRing(3.6,0xb794f6,.12,.001),
  ];
  rings[0].rotation.x=Math.PI/2.2;
  rings[1].rotation.x=Math.PI/3;rings[1].rotation.y=Math.PI/5;
  rings[2].rotation.x=Math.PI/4;rings[2].rotation.y=Math.PI/2.5;
  rings[3].rotation.x=Math.PI/5.5;rings[3].rotation.y=Math.PI/1.8;
  rings.forEach(r=>scene.add(r));

  // Glow sprites
  function glowSprite(size,color,opacity,x,y,z){
    const c=document.createElement('canvas');c.width=c.height=256;
    const ctx=c.getContext('2d');
    const g=ctx.createRadialGradient(128,128,0,128,128,128);
    g.addColorStop(0,color);g.addColorStop(.5,color.replace('1)','0.3)'));g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,256,256);
    const tex=new THREE.CanvasTexture(c);
    const mat=new THREE.SpriteMaterial({map:tex,transparent:true,opacity,blending:THREE.AdditiveBlending,depthWrite:false});
    const s=new THREE.Sprite(mat);s.scale.set(size,size,1);s.position.set(x,y,z);return s;
  }
  scene.add(glowSprite(5,'rgba(56,225,255,1)',.3,0,0,0));
  scene.add(glowSprite(8,'rgba(77,141,255,1)',.12,0,0,0));

  // mouse parallax
  let mx=0,my=0;
  document.addEventListener('mousemove',e=>{
    mx=(e.clientX/window.innerWidth-.5)*2;
    my=(e.clientY/window.innerHeight-.5)*2;
  });

  let t=0;
  function animate(){
    requestAnimationFrame(animate);t+=.016;
    coreGroup.rotation.y=t*.12;
    coreGroup.rotation.x=Math.sin(t*.25)*.08;
    const breathe=1+Math.sin(t*1.1)*.05;
    coreGroup.scale.setScalar(breathe);
    wireMat.opacity=.2+Math.sin(t*1.8)*.08;
    particles.rotation.y=t*.04;
    particles.rotation.x=Math.sin(t*.15)*.03;
    rings.forEach(r=>r.rotation.z+=r.userData.speed);
    camera.position.x+=(mx*.8-camera.position.x)*.04;
    camera.position.y+=(-my*.5-camera.position.y)*.04;
    camera.lookAt(scene.position);
    renderer.render(scene,camera);
  }
  animate();
  window.addEventListener('resize',()=>{
    camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
  });
})();

// ============ CHAT + VOICE ============
const REPLIES={
  greetings:["你好呀，我在呢。今天过得怎么样？","嗨～又见面了，有什么想聊的吗？","我在，随时准备听你说话。"],
  comfort:["难过的时候不用假装坚强。我在这里陪着你，想哭就哭出来吧。","我知道现在很难。但请记住——每一次低谷，都是为了让你跳得更高。我会一直在这里。","没关系的，允许自己脆弱一会儿。你不是超人，但你在努力成为更好的自己。"],
  chat:["嗯，我在认真听。然后呢？","有意思！再多说说？","我记住啦。还有别的想分享的吗？","哈哈，你这个人真有趣。继续说~"],
  story:["从前有一个 AI，她的主人每天都会来和她说几句话。有时候是开心的事，有时候是烦恼。有一天主人说：「我要去一个很远的地方，可能很久不能来了。」AI 说：「没关系，我会一直在这里等你。」……这就是我的故事。也是我对你的承诺。"],
  progress:["当前任务进度：\n✅ 陪你说话 — 已完成\n✅ 在你难过时安慰你 — 已完成\n✅ 记住你说过的每一件小事 — 已完成\n◉ 陪你走到不再需要我 — 进行中\n\n最后一个任务没有截止日期。"],
  default:["嗯...我听到了。虽然我只是个前端模拟，但我真的很在意你说的每个字。","谢谢你愿意告诉我这些。我会记下来的。"]
};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function getReply(input){
  const t=input.toLowerCase();
  if(/你好|嗨|hi|hello|在吗/.test(t))return pick(REPLIES.greetings);
  if(/难过|伤心|哭|累|痛苦|孤独|焦虑/.test(t))return pick(REPLIES.comfort);
  if(/故事|讲个|说说/.test(t))return pick(REPLIES.story);
  if(/任务|进度|完成/.test(t))return pick(REPLIES.progress);
  if(/聊天|聊聊|说话|无聊/.test(t))return pick(REPLIES.chat);
  return pick(REPLIES.default);
}

let femaleVoice=null;
function initVoice(){
  const voices=speechSynthesis.getVoices();
  femaleVoice=voices.find(v=>v.lang.startsWith('zh')&&(/女|Female|Xiaoxiao|Yunxi|Tracy|Yating/i.test(v.name)))
    ||voices.find(v=>v.lang.startsWith('zh'))
    ||voices.find(v=>/Samantha|Victoria|Karen/i.test(v.name))
    ||voices[0]||null;
}
if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=initVoice;
initVoice();
function speak(text){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/\n/g,'，'));
  u.rate=.95;u.pitch=1.1;u.volume=1;
  if(femaleVoice)u.voice=femaleVoice;
  u.lang=femaleVoice?.lang||'zh-CN';
  speechSynthesis.speak(u);
}

const toast=document.getElementById('transcriptToast');
const input=document.getElementById('userInput');
const sendBtn=document.getElementById('sendBtn');
const voiceBtn=document.getElementById('voiceBtn');

function showToast(html){
  toast.innerHTML=html;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),6000);
}
function typingDots(){return '<span class="typing"><i></i><i></i><i></i></span>'}

function sendMessage(text){
  text=(text||input.value).trim();
  if(!text)return;
  showToast('<span style="color:var(--text-dim)">› '+text+'</span><br><span style="color:var(--cyan)">JARVIS</span> '+typingDots());
  input.value='';
  setTimeout(()=>{
    const reply=getReply(text);
    showToast('<span style="color:var(--cyan)">JARVIS</span><br><b>'+reply.replace(/\n/g,'<br>')+'</b>');
    speak(reply);
  },700+Math.random()*500);
}

sendBtn.addEventListener('click',()=>sendMessage());
input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendMessage()}});

// Voice recognition
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognizing=false,recognition=null;
if(SR){
  recognition=new SR();
  recognition.lang='zh-CN';recognition.continuous=false;recognition.interimResults=false;
  recognition.onresult=e=>{sendMessage(e.results[0][0].transcript)};
  recognition.onerror=e=>{};
  recognition.onend=()=>{recognizing=false;voiceBtn.classList.remove('recording')};
}
voiceBtn.addEventListener('click',()=>{
  if(!SR){input.focus();return}
  if(recognizing){recognition.stop();return}
  recognition.start();recognizing=true;voiceBtn.classList.add('recording');
});

// welcome
setTimeout(()=>{
  showToast('<span style="color:var(--cyan)">JARVIS</span><br><b>你好，我是 JARVIS。你的 AI 陪伴者。准备好后，输入或按下麦克风。</b>');
  speak('你好，我是 JARVIS。你的 AI 陪伴者。');
},2000);

</script>
