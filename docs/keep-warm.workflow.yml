name: keep-warm

# The realtime-voice relay runs on a free Render instance: it sleeps after
# ~15 minutes idle and a cold boot costs the visitor ~30 seconds. Ping it on a
# schedule so it is awake when someone opens the site.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping voice relay
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 --retry 2 --retry-delay 5 \
            https://jarvis-doubao-voice.onrender.com/healthz)
          echo "healthz -> $code"
          [ "$code" = "200" ]
